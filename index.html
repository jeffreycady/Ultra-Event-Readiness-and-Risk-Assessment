<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Event Readiness & Risk Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script type="module">
  // Loaded for the "Compare Progress" feature (reading data back out
  // of a previously-exported PDF). Exposed on window since the main
  // app script below is a classic (non-module) script.
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs';
  window.pdfjsLib = pdfjsLib;
</script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  /* Page-specific styles only — shared tokens, resets, type,
     layout shell, hero mechanism, and buttons live in theme.css */

  :root{
    /* A slightly different warm-white than theme's --cream,
       used specifically for this tool's two dark headers. */
    --accent-ink:#fff6ee;
  }
  body{line-height:1.5;}

  /* ---------- HERO (page-specific overrides + form fields) ---------- */
  .hero{padding:72px 0 56px; color:var(--accent-ink);}
  .hero h1{font-size:clamp(40px, 8vw, 68px); line-height:0.94;}
  .hero-meta{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:34px;
  }
  .countdown-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--accent);
    min-height:14px;
  }
  .timing-note{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:#c8b190;
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.14);
    max-width:52ch;
  }
  .timing-note svg{flex-shrink:0;}
  .days-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#c8b190;
    margin-top:6px;
  }

  .phase-field{margin-top:28px;max-width:460px;}
  .phase-field > label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#b7ac93;
    display:block;margin-bottom:8px;
  }
  .phase-indicator{
    margin-top:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    color:#d9d2c0;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.2);
    padding:13px 14px;
  }
  .phase-indicator strong{color:#F7F2E7;}
  .phase-indicator.muted{color:#a99b7d;}

  .checkpoint-list{
    margin-top:44px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:2px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
  }
  .checkpoint-list div{
    background:var(--pine);
    padding:12px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:#cfc4a9;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .checkpoint-list span.n{color:var(--accent);}

  /* ---------- STEPPER ---------- */
  .stepper-header{
    background:var(--paper-2);
    border-bottom:1px solid var(--line-soft);
    padding:18px 0;
    position:sticky;top:0;z-index:5;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .progress-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    white-space:nowrap;
    color:var(--ink-soft);
  }
  .trail{
    flex:1;
    height:34px;
    position:relative;
  }
  .trail svg{width:100%;height:100%;display:block;overflow:visible;}
  .trail .track{stroke:var(--line);stroke-width:4;fill:none;stroke-linecap:round;}
  .trail .track-done{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round;transition:stroke-dasharray .3s ease;}
  .trail .dot{fill:var(--paper-2);stroke:var(--line);stroke-width:2.5;}
  .trail .dot.done{fill:var(--accent);stroke:var(--accent);}
  .trail .dot.current{fill:var(--pine);stroke:var(--pine);}

  .stepper-body{padding:44px 0 100px;}
  .cat-eyebrow{
    display:flex;align-items:center;gap:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px;
  }
  .cat-icon{width:34px;height:34px;flex-shrink:0;}
  .stepper-body h2{font-size:clamp(28px,5vw,40px);margin-bottom:8px;}
  .cat-tagline{color:var(--ink-soft);font-size:16px;max-width:56ch;margin-bottom:36px;font-style:italic;}

  .question{
    padding:26px 0;
    border-top:1px solid var(--line-soft);
  }
  .question:last-child{border-bottom:1px solid var(--line-soft);}
  .question p.q{
    font-size:17px;
    font-weight:600;
    margin-bottom:16px;
    max-width:62ch;
  }
  .q-num{
    font-family:'IBM Plex Mono', monospace;
    color:var(--accent);
    margin-right:8px;
  }
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    background:var(--paper-2);
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover{border-color:var(--accent);}
  .opt input{margin-top:3px;accent-color:var(--accent);flex-shrink:0;}
  .opt label{font-size:15.5px;cursor:pointer;}
  .opt.selected{border-color:var(--accent);background:#fbf1e9;}

  .stepper-nav{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:20px;
  }
  .nav-hint{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--ink-soft);}

  /* ---------- RESULTS ---------- */
  .results-header{background:var(--pine);color:var(--accent-ink);padding:56px 0 40px;position:relative;overflow:hidden;}
  .results-header::before{content:"";position:absolute;inset:0;background-image:var(--contour-pattern);opacity:0.4;}
  .results-header .wrap{position:relative;z-index:1;}
  .score-block{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:18px;}
  .score-num{font-family:'Big Shoulders Display';font-size:clamp(70px,14vw,120px);font-weight:800;line-height:0.85;}
  .score-suffix{font-family:'IBM Plex Mono';font-size:20px;color:#c8b190;padding-bottom:14px;}
  .tier-pill{
    font-family:'IBM Plex Mono';font-size:13px;letter-spacing:0.08em;text-transform:uppercase;
    padding:8px 16px;border-radius:20px;display:inline-block;margin-top:14px;
  }
  .results-body{padding:48px 0 100px;}
  .section-title{font-size:24px;margin-bottom:6px;}
  .section-sub{color:var(--ink-soft);font-size:15px;margin-bottom:28px;max-width:60ch;}

  .skyline-wrap{background:var(--paper-2);border:1px solid var(--line-soft);padding:24px 20px 12px;margin-bottom:56px;}
  .skyline-wrap svg{width:100%;height:auto;display:block;}

  .radar-wrap{background:var(--paper-2);border:1px solid var(--line-soft);padding:24px 20px 18px;margin-bottom:56px;}
  .radar-wrap svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;}
  .radar-caption{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6;}

  /* ---------- COMPARE PROGRESS ---------- */
  .compare-body{padding:48px 0 100px;}
  .compare-uploads{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;}
  .upload-slot{
    background:var(--paper-2);border:1px dashed var(--line);padding:22px;
    display:flex;flex-direction:column;gap:10px;min-height:150px;
  }
  .upload-slot.ready{border-style:solid;border-color:var(--low);}
  .upload-slot.error{border-style:solid;border-color:var(--high);}
  .upload-slot h3{font-size:12.5px;font-family:'IBM Plex Mono', monospace;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin:0;}
  .upload-summary{font-size:14px;color:var(--ink);}
  .upload-summary strong{display:block;font-size:24px;font-family:'Big Shoulders Display';margin-bottom:2px;}
  .upload-error{font-size:13px;color:var(--high);margin:0;}
  .file-label{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--accent);cursor:pointer;
    border:1px solid var(--accent);padding:8px 14px;border-radius:var(--radius);width:fit-content;
    margin-top:auto;
  }
  .file-label:hover{background:rgba(203,90,40,0.08);}
  .file-label input[type=file]{display:none;}
  .upload-switch{
    font-family:'IBM Plex Mono', monospace;font-size:11.5px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;text-align:left;
  }
  .upload-switch:hover{color:var(--accent);}
  .compare-hint{color:var(--ink-soft);font-style:italic;font-size:14.5px;margin:20px 0 40px;}
  .compare-meta{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--ink-soft);margin-bottom:20px;}
  .insight-list{list-style:none;padding:0;margin:0 0 44px;display:flex;flex-direction:column;gap:12px;}
  .insight-list li{background:var(--paper-2);border-left:3px solid var(--accent);padding:14px 18px;font-size:14.5px;}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .legend-dot.before{background:var(--paper-2);border:2px dashed var(--ink-soft);}
  .legend-dot.after{background:var(--accent);border:2px solid var(--accent);}

  @media (max-width:600px){
    .compare-uploads{grid-template-columns:1fr;}
  }

  .priority-list{display:flex;flex-direction:column;gap:18px;margin-bottom:56px;}
  .priority-card{
    border-left:4px solid var(--accent);
    background:var(--paper-2);
    padding:20px 22px;
  }
  .priority-card h3{font-size:19px;letter-spacing:0.01em;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .priority-card .tier-tag{
    font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    padding:3px 9px;border-radius:12px;
  }
  .priority-card p{font-size:15px;color:var(--ink-soft);margin-top:8px;}

  .info-btn{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--ink-soft);background:transparent;color:var(--ink-soft);
    font-family:'IBM Plex Mono';font-size:12px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    margin-left:auto;
  }
  .info-btn:hover{border-color:var(--accent);color:var(--accent);}
  .resource-link{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 0;border-top:1px solid var(--line-soft);
  }
  .resource-link:first-of-type{border-top:none;}
  .resource-link .kind{
    font-family:'IBM Plex Mono';font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--accent);width:52px;flex-shrink:0;padding-top:2px;
  }
  .resource-link .body a{
    font-size:15px;color:var(--ink);text-decoration:none;font-weight:600;
  }
  .resource-link .body a:hover{color:var(--accent);text-decoration:underline;}
  .resource-link .body .src{
    display:block;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);margin-top:3px;
  }

  .checklist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .check-item{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;}
  .check-item input[type=checkbox]{margin-top:4px;width:15px;height:15px;accent-color:var(--accent);flex-shrink:0;}
  .check-item label{cursor:pointer;flex:1;}
  .check-item.done label{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line);}
  .item-link{
    flex-shrink:0;margin-left:auto;padding-left:8px;
    font-size:13px;color:var(--ink-soft);text-decoration:none;line-height:1.4;
  }
  .item-link:hover{color:var(--accent);}

  .on-track-strip{
    background:var(--paper-2);border:1px solid var(--line-soft);
    padding:18px 22px;margin-bottom:56px;
  }
  .on-track-strip h3{font-size:15px;letter-spacing:0.03em;margin-bottom:12px;font-family:'IBM Plex Mono';text-transform:uppercase;color:var(--low);}
  .on-track-items{display:flex;flex-wrap:wrap;gap:8px 18px;}
  .on-track-items span{
    font-size:14px;display:flex;align-items:center;gap:6px;color:var(--ink-soft);
  }
  .on-track-items span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--low);display:inline-block;}

  .coach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px;background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:8px;}

  .built-by-coach{
    background:var(--pine-2);color:var(--cream);
    padding:28px 26px;margin-bottom:36px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;
  }
  .built-by-coach .copy{flex:1;min-width:220px;}
  .built-by-coach h3{font-size:19px;color:var(--cream);margin-bottom:6px;}
  .built-by-coach p{font-size:14px;color:#d9d2c0;margin:0;max-width:48ch;}
  .coach-card{background:var(--paper-2);padding:20px;display:flex;flex-direction:column;gap:8px;}
  .coach-card h4{font-family:'Big Shoulders Display';font-size:17px;letter-spacing:0.01em;text-transform:none;}
  .coach-card p{font-size:13.5px;color:var(--ink-soft);flex:1;}
  .coach-card a{
    font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  }
  .coach-card a:hover{text-decoration:underline;}

  /* ---------- SITE FOOTER + LICENSE MODAL ---------- */
  .site-footer{
    text-align:center; padding:18px 24px 28px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);
  }
  .site-footer .footer-dot{margin:0 8px;opacity:0.6;}
  .site-footer button{
    background:none;border:none;color:var(--ink-soft);text-decoration:underline;
    font-family:'IBM Plex Mono', monospace;font-size:11px;cursor:pointer;padding:0;
  }
  .site-footer button:hover{color:var(--accent);}
  .hero .site-footer{color:#a99b7d;}
  .hero .site-footer button{color:#a99b7d;}
  .hero .site-footer button:hover{color:var(--accent);}
  .results-body .site-footer{padding-top:0;}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(27,42,31,0.72);
    z-index:50; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--paper-2); max-width:560px; width:100%; max-height:85vh; overflow-y:auto;
    padding:32px; position:relative; border:1px solid var(--line-soft);
  }
  .modal-box h2{font-size:24px;margin-bottom:4px;}
  .modal-box .modal-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:20px;}
  .modal-close{
    position:absolute; top:20px; right:20px; background:none; border:none;
    font-size:22px; line-height:1; color:var(--ink-soft); cursor:pointer; padding:4px;
  }
  .modal-close:hover{color:var(--accent);}
  .license-tier{border:1px solid var(--line-soft); padding:16px 18px; margin-bottom:14px;}
  .license-tier h3{font-size:15px;font-family:'Big Shoulders Display';text-transform:uppercase;letter-spacing:0.02em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
  .license-tier .price{font-family:'IBM Plex Mono';color:var(--accent);font-size:13px;}
  .license-tier p{font-size:13.5px;color:var(--ink-soft);}
  .modal-box .fine-print{font-size:12px;color:var(--ink-soft);margin-top:18px;line-height:1.6;}
  .modal-box .fine-print strong{color:var(--ink);}

  .breakdown-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line-soft);margin-bottom:56px;}
  .breakdown-row{
    display:flex;align-items:center;gap:16px;
    padding:14px 0;border-bottom:1px solid var(--line-soft);
  }
  .breakdown-name{width:220px;flex-shrink:0;font-size:14.5px;font-weight:600;font-family:'Source Serif 4';}
  .breakdown-bar-track{flex:1;height:10px;background:rgba(0,0,0,0.06);position:relative;}
  .breakdown-bar-fill{height:100%;}
  .breakdown-score{
    width:70px;text-align:right;font-family:'IBM Plex Mono';font-size:13px;flex-shrink:0;
  }

  .report-meta{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);margin-bottom:36px;}

  footer.note{
    max-width:60ch;font-size:13.5px;color:var(--ink-soft);
    border-top:1px solid var(--line-soft);padding-top:20px;margin-top:8px;
  }

  @media (max-width:640px){
    .breakdown-name{width:130px;font-size:13px;}
    .checkpoint-list{grid-template-columns:repeat(2,1fr);}
    .progress-label{display:none;}
  }

  @media print{
    .hero,.stepper-header,.stepper-body,.no-print{display:none !important;}
    .results-header{background:#fff !important;color:#000 !important;}
    .results-header::before{display:none;}
    .tier-pill{border:1px solid #000;}
    body{background:#fff;}
    .skyline-wrap, .radar-wrap, .priority-card, .breakdown-row, .coach-card{break-inside:avoid;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =========================================================
   DATA
   Each question's options are ordered best(0) -> worst(last).
   Score = index / (options.length-1) -> 0..1 risk fraction.
   Questions with a `naIndex` property have a trailing "Not
   applicable" option at that index: selecting it scores 0
   (no risk), and the real options are scored against
   (naIndex-1) instead of the full option count, so the worst
   real answer still reaches a full 1.0.
========================================================= */
const CATEGORIES = [
  {
    id:'terrain', name:'Terrain & Route Profile', short:'Terrain',
    tagline:"How the ground ahead matches what you've actually trained on.",
    remediation:{
      summary:"Close the gap between your training terrain and what's actually ahead.",
      actions:[
        {text:"Add training sessions on terrain that matches the route's technicality and grade", url:"https://www.irunfar.com/an-introduction-to-downhill-trail-running-techniques"},
        {text:"Study the elevation profile and route maps in detail", url:"https://nolimitsendurance.com/how-to-read-an-elevation-profile/"},
        {text:"Cover key sections of the actual route in training or recon, if possible", url:"https://nolimitsendurance.com/how-to-read-an-elevation-profile/"},
        {text:"Practice the specific technical skills the route demands (descending, scrambling, route-finding)", url:"https://www.youtube.com/watch?v=EIJ_4g4S6vA"}
      ]
    },
    questions:[
      {q:"What best describes the terrain you'll be covering?",
       opts:["Mostly flat, non-technical (road, gravel, buffed trail)","Rolling hills, mostly runnable or easily walkable trail","Mountainous, with sustained climbs and descents","Highly technical — scrambling, loose rock, exposed ridgelines, or route-finding required"]},
      {q:"Roughly how much elevation gain/loss does the route have?",
       opts:["Under 50 ft of gain per mile (~9 m/km, flat)","50–150 ft per mile (~9–28 m/km, rolling)","150–300 ft per mile (~28–57 m/km, mountainous)","Over 300 ft per mile (~57+ m/km), or sustained steep grades"]},
      {q:"How much training have you done on terrain that matches the route?",
       opts:["Extensive — most long efforts mimic this terrain","Some — a few key sessions on similar terrain","Limited — mostly different terrain than what's ahead","None — this will be my first time on this type of terrain"]},
      {q:"How familiar are you with the actual route?",
       opts:["I've covered all or most of it in training or recon","I've studied the elevation profile and maps closely","I've glanced at the route info briefly","I know almost nothing about the specific route"]},
      {q:"How confident are you in the technical skills this route demands (descending loose footing, scrambling, stream crossings, route-finding)?",
       opts:["Very confident — I've practiced these specifically","Comfortable, with some practice","A little rusty or untested","Not confident, or never practiced"]}
    ]
  },
  {
    id:'environment', name:'Environment & Climate', short:'Environment',
    tagline:"Heat, cold, altitude, and humidity all change the math — if your body hasn't met them yet.",
    remediation:{
      summary:"Build acclimation time before you're in a climate your body hasn't met.",
      actions:[
        {text:"Add dedicated heat, humidity, or altitude-specific sessions in the time you have left", url:"https://www.irunfar.com/handle-the-heat-heat-acclimation-for-endurance-running"},

/* =========================================================
   PHASE-AWARE ACCESSORS
   The Training & Fitness Readiness category has two question
   sets depending on how far out the event is. Everything else
   is phase-agnostic.
========================================================= */
function getQuestions(ci){
  const cat = CATEGORIES[ci];
  return cat.questionsByPhase ? cat.questionsByPhase[state.phase] : cat.questions;
}
function getTagline(ci){
  const cat = CATEGORIES[ci];
  return cat.taglineByPhase ? cat.taglineByPhase[state.phase] : cat.tagline;
}
function getRemediation(ci){
  const cat = CATEGORIES[ci];
  return cat.remediationByPhase ? cat.remediationByPhase[state.phase] : cat.remediation;
}
function suggestPhase(dateStr){
  const d = daysUntil(dateStr);
  if(d===null) return null;
  return d > 21 ? 'build' : 'taper';
}
function phaseCopy(phase){
  return phase==='build'
    ? { label:'6\u201312 Weeks Out', short:'6\u201312 weeks out', desc:'Build / peak phase \u2014 training plan still adjustable' }
    : { label:'3 Weeks Out', short:'3 weeks out', desc:'Taper / final prep \u2014 protecting fitness, not adding it' };
}
function phaseStatusText(){
  if(!state.eventDate){
    const info = phaseCopy('taper');
    return `No start date yet \u2014 using <strong>${info.label}</strong> questions by default. Add a start date above to set this automatically.`;
  }
  const info = phaseCopy(state.phase);
  return `<strong>${info.label}</strong> \u2014 ${info.desc} (${daysUntilText(state.eventDate)}).`;
}

/* =========================================================
   FEATURED COACH (referral attribution)
   ------------------------------------------------------------
   If you self-host your own copy of this tool, you don't need
   any of this — just edit the 'jeff' entry below (or replace
   it with your own) and it'll always show. This machinery only
   matters if you're running ONE shared instance that multiple
   licensed coaches send their own clients to.

   HOW TO ADD A LICENSED COACH:
   1. Add an entry below, keyed by a short slug (letters only).
   2. Give that coach a link like:
        https://uera.jcady.org/?coach=SLUG
      Anyone who lands via that link sees their info instead of
      the default. No param (or an unrecognized one) falls back
      to DEFAULT_COACH_SLUG. As a secondary check, if someone
      clicks straight through from a listed coach's own site
      with no ?coach= param, their referring domain is matched
      against the registry too — but don't rely on that alone,
      most real shares (text, email, social) carry no referrer.
   3. isCreator:true shows "Built by a coach" framing (use this
      only for you, the tool's actual author). Any other entry
      should have isCreator:false and a blurb written as a
      referral, not an authorship claim.
========================================================= */
const DEFAULT_COACH_SLUG = 'jeff';
const COACH_REGISTRY = {
  jeff:{
    isCreator:true,
    name:'Jeff Cady',
    url:'https://jcady.org',
    blurb:"Hi, I'm Jeff Cady \u2014 the UESCA certified ultrarunning coach who built this tool. If you'd rather have a training plan built around your real risk factors than figure it out solo, let's talk."
  }
  // Example of a licensed coach — copy this shape, uncomment,
  // and give them the matching ?coach=sarah link:
  // sarah:{
  //   isCreator:false,
  //   name:'Sarah Smith',
  //   url:'https://sarahsmithcoaching.com',
  //   blurb:"This assessment was shared with you by Sarah Smith, a certified coach. Want help turning these results into an actual plan? Get in touch."
  // }
};
function getFeaturedCoach(){
  let slug = null;
  try{ slug = new URLSearchParams(window.location.search).get('coach'); }catch(e){}
  if(slug && COACH_REGISTRY[slug]) return COACH_REGISTRY[slug];

  try{
    if(document.referrer){
      const refHost = new URL(document.referrer).hostname.replace(/^www\./,'');
      for(const key in COACH_REGISTRY){
        const entryHost = new URL(COACH_REGISTRY[key].url).hostname.replace(/^www\./,'');
        if(refHost === entryHost) return COACH_REGISTRY[key];
      }
    }

/* =========================================================
   PDF EXPORT
   Builds the report directly with jsPDF's vector/text API
   (not a DOM screenshot) so it renders cleanly regardless of
   the SVG/CSS-variable styling used on screen.
========================================================= */
const PDF_COLORS = {
  ink:'#232922', inkSoft:'#565f4e', pine:'#1B2A1F',
  accent:'#CB5A28', low:'#4B7A4E', mid:'#B2812A', high:'#B23B2E',
  lineSoft:'#c9c0a7', cream:'#F7F2E7', dim:'#c8b190'
};
function pdfTierColor(score){
  if(score < 34) return PDF_COLORS.low;
  if(score < 67) return PDF_COLORS.mid;
  return PDF_COLORS.high;
}
function pdfFilename(){
  const base = (state.eventName || 'ultra-event').trim().toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'ultra-event';
  const datePart = state.eventDate || new Date().toISOString().slice(0,10);
  return `readiness-risk-check_${base}_${datePart}.pdf`;
}

function generatePDF(){
  if(typeof window.jspdf === 'undefined'){
    alert("The PDF library hasn't finished loading (needs an internet connection). Try again in a moment, or use the Print button instead.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 50;
  const contentW = pageW - margin*2;
  let y = margin;

  function ensureSpace(h){
    if(y + h > pageH - 60){ doc.addPage(); y = margin; }
  }
  function sectionHeader(title, sub){
    ensureSpace(sub ? 40 : 26);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(PDF_COLORS.ink);
    doc.text(title, margin, y); y += 16;
    if(sub){
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(PDF_COLORS.inkSoft);
      doc.splitTextToSize(sub, contentW).forEach(l=>{ doc.text(l, margin, y); y += 12; });
    }
    y += 6;
  }

  // ---- compute data ----
  const catScores = CATEGORIES.map((c,i)=>({
    id:c.id, name:c.name, score:categoryScore(i), remediation:getRemediation(i)
  }));
  const sorted = [...catScores].sort((a,b)=>b.score-a.score);
  const overall = overallScore();
  const overallColor = pdfTierColor(overall);
  const overallTierLabel = overall<34?'Low':overall<67?'Moderate':'High';
  const needsWork = sorted.filter(c=>c.score>=34);
  const onTrack = sorted.filter(c=>c.score<34);
  const phaseLabel = phaseCopy(state.phase).short;
  const dText = daysUntilText(state.eventDate);

  // ---- header block ----
  doc.setFillColor(PDF_COLORS.pine);
  doc.rect(0,0,pageW,118,'F');

  doc.setFont('courier','normal'); doc.setFontSize(9); doc.setTextColor(PDF_COLORS.dim);
  doc.text(`ULTRA EVENT READINESS & RISK ASSESSMENT \u00b7 v${QUESTIONNAIRE_VERSION}`, margin, 34);

  const maxTitleW = contentW - 150;
  const titleRaw = (state.eventName || 'Your Event') + (dateStr ? '  \u00b7  '+dateStr : '');
  const titleLines = doc.splitTextToSize(titleRaw, maxTitleW);
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(PDF_COLORS.cream);
  doc.text(titleLines[0] + (titleLines.length>1 ? '\u2026' : ''), margin, 58);

  doc.setFont('courier','normal'); doc.setFontSize(9); doc.setTextColor(PDF_COLORS.dim);
  doc.text(phaseLabel + (dText ? '  \u00b7  '+dText : ''), margin, 76);

  doc.setFont('helvetica','bold'); doc.setFontSize(32); doc.setTextColor(overallColor);
  doc.text(String(overall), pageW-margin, 60, {align:'right'});
  doc.setFont('courier','normal'); doc.setFontSize(8.5); doc.setTextColor(PDF_COLORS.dim);
  doc.text('/ 100 OVERALL RISK', pageW-margin, 74, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(overallColor);
  doc.text(overallTierLabel.toUpperCase()+' RISK', pageW-margin, 92, {align:'right'});

  y = 118 + 30;

  // ---- full breakdown ----
  sectionHeader('Full Breakdown', 'All ten checkpoints, ranked by risk.');
  const barX = margin + 190, barW = contentW - 190 - 44;
  sorted.forEach(c=>{
    ensureSpace(20);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(PDF_COLORS.ink);
    doc.text(doc.splitTextToSize(c.name, 180)[0], margin, y+7);
    doc.setFillColor(PDF_COLORS.lineSoft);
    doc.rect(barX, y, barW, 7, 'F');

  });

  // ---- remediation plan ----
  sectionHeader('Remediation Plan', needsWork.length
    ? 'Every checkpoint scoring Moderate or High, with concrete next steps.'
    : 'Nothing scored Moderate or High risk \u2014 see On Track below.');

  needsWork.forEach(c=>{
    const tColor = pdfTierColor(c.score);
    ensureSpace(46);
    doc.setFillColor(tColor);
    doc.rect(margin, y-10, 3, 16, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(PDF_COLORS.ink);

    doc.splitTextToSize(c.remediation.summary, contentW-12).forEach(l=>{
      ensureSpace(12); doc.text(l, margin+12, y); y += 12;
    });
    y += 5;

    c.remediation.actions.forEach(a=>{
      const actionLines = doc.splitTextToSize(a.text, contentW-32);
      const hasLink = !!a.url;
      const blockH = actionLines.length*12 + (hasLink ? 11 : 0) + 7;
      ensureSpace(blockH);
      doc.setDrawColor(PDF_COLORS.inkSoft); doc.setLineWidth(0.75);
      doc.rect(margin+12, y-8, 7.5, 7.5, 'S');
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(PDF_COLORS.ink);
      actionLines.forEach((ln,li)=> doc.text(ln, margin+28, y + li*12));
      y += actionLines.length*12;
      if(hasLink){
        doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(PDF_COLORS.accent);

      }
      y += 7;
    });

  });

  // ---- on track ----
  if(onTrack.length){
    sectionHeader('On Track');
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(PDF_COLORS.low);
    onTrack.forEach(c=>{
      ensureSpace(14);
      doc.text(`\u2022  ${c.name} \u2014 ${c.score}/100`, margin, y);
      y += 14;
    });
    y += 12;
  }

  // ---- find a coach ----
  sectionHeader('Find a Coach');

  const featuredCoach = getFeaturedCoach();
  ensureSpace(46);
  doc.setFillColor(PDF_COLORS.accent);
  doc.rect(margin, y-10, 3, 16, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(PDF_COLORS.ink);
  doc.text(featuredCoach.isCreator ? 'Built by a coach' : 'Your coach', margin+12, y); y += 13;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(PDF_COLORS.inkSoft);
  doc.splitTextToSize(featuredCoach.blurb, contentW-12).forEach(l=>{ ensureSpace(11); doc.text(l, margin+12, y); y += 11; });
  doc.setFont('courier','normal'); doc.setFontSize(8.5); doc.setTextColor(PDF_COLORS.accent);
  doc.textWithLink(featuredCoach.url, margin+12, y+3, { url: featuredCoach.url });
  y += 26;

  COACH_LINKS.forEach(link=>{
    ensureSpace(42);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(PDF_COLORS.ink);
    doc.text(link.name, margin, y); y += 13;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(PDF_COLORS.inkSoft);
    doc.splitTextToSize(link.blurb, contentW).forEach(l=>{ ensureSpace(11); doc.text(l, margin, y); y += 11; });
    doc.setFont('courier','normal'); doc.setFontSize(8.5); doc.setTextColor(PDF_COLORS.accent);
    doc.textWithLink(link.url, margin, y+3, { url: link.url });
    y += 22;
  });

  // ---- disclaimer ----
  ensureSpace(36);
  doc.setDrawColor(PDF_COLORS.lineSoft); doc.setLineWidth(0.5);
  doc.line(margin, y, pageW-margin, y); y += 14;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(PDF_COLORS.inkSoft);
  const disclaimer = "This tool is a self-assessment aid for identifying where your final prep needs attention. It doesn't replace guidance from a coach, and isn't medical advice \u2014 talk to a doctor about any pre-existing condition or new symptom before you go.";
  doc.splitTextToSize(disclaimer, contentW).forEach(l=>{ ensureSpace(10); doc.text(l, margin, y); y += 10; });
  y += 4;
  ensureSpace(10);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(PDF_COLORS.inkSoft);
  doc.text(copyrightLine(), margin, y); y += 10;

  // ---- running footer + page numbers ----
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setFont('courier','normal'); doc.setFontSize(7.5); doc.setTextColor(PDF_COLORS.inkSoft);
    doc.text(`Ultra Event Readiness & Risk Assessment \u00b7 v${QUESTIONNAIRE_VERSION}`, margin, pageH-24);
    doc.text(`Page ${p} of ${totalPages}`, pageW-margin, pageH-24, {align:'right'});
  }

  // ---- hidden data marker (for the "Compare Progress" feature) ----
  // Invisible to anyone viewing the PDF (1pt, white-on-white, tucked
  // into a page corner) but present in the PDF's text layer so a
  // later upload of this exact file can be read back reliably,
  // instead of trying to re-derive scores from rendered text.
  const scoresById = {};
  catScores.forEach(c=> scoresById[c.id] = c.score);
  const embedPayload = JSON.stringify({
    t:'uera_v1', qv:QUESTIONNAIRE_VERSION,
    event:state.eventName||'', date:state.eventDate||'', phase:state.phase,
    overall, scores:scoresById
  });
  doc.setPage(totalPages);
  doc.setFont('courier','normal'); doc.setFontSize(1); doc.setTextColor(255,255,255);
  doc.text('UERA_DATA_V1:'+embedPayload, 2, 2);

  doc.save(pdfFilename());
}

function compareFilename(before, after){
  const base = (after.event || before.event || 'ultra-event').trim().toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'ultra-event';
  const datePart = after.date || new Date().toISOString().slice(0,10);

/* =========================================================
   COMPARE PROGRESS
   Read a UERA-exported PDF back in (via the hidden data marker
   embedded above), and/or use the just-completed live session,
   to show change over time between two assessments.
========================================================= */
async function parseUeraPdf(file){
  if(typeof window.pdfjsLib === 'undefined'){
    return {ok:false, error:"The PDF reader hasn't finished loading (needs an internet connection). Wait a moment and try again."};
  }
  let buf;
  try{
    buf = await file.arrayBuffer();
  }catch(e){
    return {ok:false, error:"Couldn't read that file."};
  }
  let fullText = '';
  try{
    const pdf = await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      fullText += content.items.map(i=>i.str).join(' ') + ' ';
    }
  }catch(e){
    return {ok:false, error:"That doesn't look like a valid PDF."};
  }
  const match = fullText.match(/UERA_DATA_V1:(\{.*?\})(?:\s|$)/);
  if(!match){
    return {ok:false, error:"This PDF doesn't contain the data this tool needs. Only PDFs exported by this tool's \u201cExport PDF\u201d button work here \u2014 try re-exporting a fresh copy if you still have access to that assessment."};
  }
  let data;
  try{ data = JSON.parse(match[1]); }
  catch(e){ return {ok:false, error:"Found this tool's data in that PDF, but couldn't read it \u2014 the file may be damaged."}; }
  if(!data || data.t!=='uera_v1' || !data.scores){
    return {ok:false, error:"Found data in that PDF, but not in a format this version understands."};
  }
  return {ok:true, data};
}

function comparisonRadarSVG(beforeData, afterData){
  const n = CATEGORIES.length;
  const W = 480, H = 460, cx = 240, cy = 232, R = 152, RINGS = 4;
  const angle = i => -Math.PI/2 + (i*2*Math.PI)/n;
  const pt = (i, r) => [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];

  let rings = '';
  for(let t=1; t<=RINGS; t++){
    const r = (R*t)/RINGS;
    const pts = [];
    for(let i=0;i<n;i++) pts.push(pt(i,r).map(v=>v.toFixed(1)).join(','));
    rings += `<polygon points="${pts.join(' ')}" fill="none" stroke="${t===RINGS?'#A79C82':'#ded6bf'}" stroke-width="1"/>`;
  }
  let spokes = '';
  for(let i=0;i<n;i++){
    const [x,y] = pt(i,R);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ded6bf" stroke-width="1"/>`;
  }
  let axisLabels = '';
  for(let i=0;i<n;i++){
    const a = angle(i);
    const [x,y] = pt(i, R+24);
    const c = Math.cos(a), s = Math.sin(a);
    const anchor = Math.abs(c) < 0.35 ? 'middle' : (c>0?'start':'end');
    let dy = '0.35em';
    if(s < -0.35) dy='0em';
    if(s > 0.35) dy='0.85em';
    axisLabels += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dy="${dy}" font-size="11.5" font-family="IBM Plex Mono" fill="var(--ink-soft)">${CATEGORIES[i].short}</text>`;
  }

  function shapePoints(assessmentData){
    return CATEGORIES.map((c,i)=>{
      const score = assessmentData.scores[c.id];
      const readiness = 100 - (typeof score==='number' ? score : 50);
      return pt(i, (R*readiness)/100);
    });
  }
  const beforePts = shapePoints(beforeData);
  const afterPts = shapePoints(afterData);
  const beforeStr = beforePts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const afterStr = afterPts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');

  let afterVertices = '';
  afterPts.forEach((p,i)=>{
    const t = tierOf(afterData.scores[CATEGORIES[i].id]);
    afterVertices += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.2" fill="${t.color}" stroke="#F1EEE1" stroke-width="1.5"/>`;
  });
  let beforeVertices = '';
  beforePts.forEach((p)=>{
    beforeVertices += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#F1EEE1" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  });

  return `
  <svg viewBox="0 0 ${W} ${H}">
    ${rings}
    ${spokes}
    <polygon points="${beforeStr}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
    <polygon points="${afterStr}" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${beforeVertices}
    ${afterVertices}
    ${axisLabels}
  </svg>`;
}

function generateInsights(beforeData, afterData){
  const insights = [];
  const overallDelta = afterData.overall - beforeData.overall;
  if(Math.abs(overallDelta) < 5){
    insights.push(`Your overall risk score is about the same as last time (${beforeData.overall} \u2192 ${afterData.overall}).`);
  } else if(overallDelta < 0){
    insights.push(`Your overall risk dropped from ${beforeData.overall} to ${afterData.overall} \u2014 a ${Math.abs(overallDelta)}-point improvement.`);
  } else {
    insights.push(`Your overall risk went up from ${beforeData.overall} to ${afterData.overall} \u2014 worth digging into why before you go further.`);
  }

  const deltas = CATEGORIES.map(c=>({
    id:c.id, name:c.name,
    before:beforeData.scores[c.id], after:afterData.scores[c.id],
    delta: afterData.scores[c.id] - beforeData.scores[c.id]
  })).filter(d=> typeof d.before==='number' && typeof d.after==='number');

  const sorted = [...deltas].sort((a,b)=>a.delta-b.delta);
  const mostImproved = sorted[0];
  const mostRegressed = sorted[sorted.length-1];

  if(mostImproved && mostImproved.delta <= -10){
    insights.push(`Biggest improvement: ${mostImproved.name}, down from ${mostImproved.before} to ${mostImproved.after}.`);
  }
  if(mostRegressed && mostRegressed.delta >= 15){
    insights.push(`Worth watching: ${mostRegressed.name} got worse, from ${mostRegressed.before} to ${mostRegressed.after}.`);
  }

  const resolved = deltas.filter(d=> d.before>=34 && d.after<34).map(d=>d.name);
  if(resolved.length){
    insights.push(`Fully resolved since last time: ${resolved.join(', ')}.`);
  }
  const newConcerns = deltas.filter(d=> d.before<34 && d.after>=34).map(d=>d.name);
  if(newConcerns.length){
    insights.push(`New since last time: ${newConcerns.join(', ')} now needs attention.`);
  }

  const stillWeak = deltas.filter(d=> d.after>=34).sort((a,b)=>b.after-a.after);
  return { insights, deltas: sorted, stillWeak };
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function daysUntilText(dateStr){
  const d = daysUntil(dateStr);
  if(d===null) return '';
  if(d>1) return `${d} days out`;
  if(d===1) return 'Tomorrow';
  if(d===0) return 'Today';
  if(d===-1) return '1 day since';
  return `${Math.abs(d)} days since`;
}

/* =========================================================

========================================================= */
function categoryScore(ci){
  const qs = getQuestions(ci);
  const ans = state.answers[ci];
  let total = 0;
  ans.forEach((idx,qi)=>{
    const q = qs[qi];
    const hasNA = q.naIndex !== undefined;
    const isNA = hasNA && idx === q.naIndex;
    const max = hasNA ? q.naIndex - 1 : q.opts.length - 1;
    total += isNA ? 0 : idx / max;
  });
  return Math.round((total/ans.length)*100);
}
function tierOf(score){
  if(score < 34) return {label:'Low', color:'var(--low)', bg:'var(--low-bg)'};
  if(score < 67) return {label:'Moderate', color:'var(--mid)', bg:'var(--mid-bg)'};
  return {label:'High', color:'var(--high)', bg:'var(--high-bg)'};
}
function overallScore(){
  const scores = CATEGORIES.map((c,i)=>categoryScore(i));
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
function allAnswered(ci){
  return state.answers[ci].every(v=>v!==null);
}

function skylineSVG(catScores){
  const n = catScores.length;
  const w = 900, h = 220, baseY = 190, gap = w/n;
  const maxPeak = 140;
  let bars = '';
  let labels = '';
  catScores.forEach((cs,i)=>{
    const x = i*gap + gap/2;
    const peakH = 26 + (cs.score/100)*maxPeak;
    const tier = tierOf(cs.score);
    const halfW = gap*0.34;
    bars += `<polygon points="${x-halfW},${baseY} ${x},${baseY-peakH} ${x+halfW},${baseY}" fill="${tier.color}" opacity="0.85"/>`;
    bars += `<text x="${x}" y="${baseY-peakH-10}" text-anchor="middle" class="mono" font-size="13" fill="${tier.color}" font-family="IBM Plex Mono">${cs.score}</text>`;
    labels += `<text x="${x}" y="${baseY+22}" text-anchor="middle" font-size="11.5" fill="#565f4e" font-family="IBM Plex Mono">${cs.short}</text>`;
  });
  return `
  <svg viewBox="0 0 ${w} ${h+20}">
    <line x1="0" y1="${baseY-67}" x2="${w}" y2="${baseY-67}" stroke="#c9c0a7" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="${w-4}" y="${baseY-72}" text-anchor="end" font-size="10" fill="#8a8168" font-family="IBM Plex Mono">MODERATE THRESHOLD</text>
    <line x1="0" y1="${baseY}" x2="${w}" y2="${baseY}" stroke="#A79C82" stroke-width="1.5"/>
    ${bars}
    ${labels}
  </svg>`;
}

function radarSVG(catScores){
  // catScores in original checkpoint order (not risk-sorted) so the shape
  // stays consistent between assessments. Plots READINESS (100 - risk
  // score) so a bigger, fuller shape reads as "more prepared" — the
  // intuitive direction for a profile chart. Each vertex is colored by
  // that checkpoint's own risk tier, so weak points are visible even
  // within an otherwise strong shape.
  const n = catScores.length;
  const W = 480, H = 460, cx = 240, cy = 232, R = 152, RINGS = 4;
  const angle = i => -Math.PI/2 + (i*2*Math.PI)/n;
  const pt = (i, r) => [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];

  let rings = '';
  for(let t=1; t<=RINGS; t++){
    const r = (R*t)/RINGS;
    const pts = [];
    for(let i=0;i<n;i++) pts.push(pt(i,r).map(v=>v.toFixed(1)).join(','));
    rings += `<polygon points="${pts.join(' ')}" fill="none" stroke="${t===RINGS?'#A79C82':'#ded6bf'}" stroke-width="1"/>`;
  }

  let spokes = '';
  for(let i=0;i<n;i++){
    const [x,y] = pt(i,R);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ded6bf" stroke-width="1"/>`;
  }

  let ringLabels = '';
  for(let t=1;t<=RINGS;t++){
    const val = Math.round(100*t/RINGS);
    ringLabels += `<text x="${cx+6}" y="${(cy-(R*t)/RINGS+4).toFixed(1)}" font-size="9.5" fill="#8a8168" font-family="IBM Plex Mono">${val}</text>`;
  }

  let axisLabels = '';
  for(let i=0;i<n;i++){
    const a = angle(i);
    const [x,y] = pt(i, R+24);
    const c = Math.cos(a), s = Math.sin(a);
    const anchor = Math.abs(c) < 0.35 ? 'middle' : (c>0?'start':'end');
    let dy = '0.35em';
    if(s < -0.35) dy='0em';
    if(s > 0.35) dy='0.85em';
    const t = tierOf(catScores[i].score);
    axisLabels += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dy="${dy}" font-size="11.5" font-family="IBM Plex Mono" fill="${t.color}">${catScores[i].short}</text>`;
  }

  const pts = catScores.map((cs,i)=>{
    const readiness = 100 - cs.score;
    return pt(i, (R*readiness)/100);
  });
  const ptStr = pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const overallColor = tierOf(overallScore()).color;

  let vertices = '';
  pts.forEach((p,i)=>{
    const t = tierOf(catScores[i].score);
    vertices += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.2" fill="${t.color}" stroke="#F1EEE1" stroke-width="1.5"/>`;
  });

  return `
  <svg viewBox="0 0 ${W} ${H}">
    ${rings}
    ${spokes}
    <polygon points="${ptStr}" fill="${overallColor}" fill-opacity="0.15" stroke="${overallColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${vertices}
    ${ringLabels}
    ${axisLabels}
  </svg>`;
}

  <section class="results-body">
    <div class="wrap">

      <h2 class="section-title">Risk skyline</h2>
      <p class="section-sub">Each peak is one checkpoint. Taller and redder means more risk — that's where a rough patch is most likely to start.</p>
      <div class="skyline-wrap">${skylineSVG(catScores)}</div>

      <h2 class="section-title">Readiness radar</h2>
      <p class="section-sub">The same ten checkpoints as one shape. Bigger and further out is better — each point is colored by that checkpoint's own risk level, so a weak spot still stands out even inside a strong overall shape.</p>
      <div class="radar-wrap">
        ${radarSVG(catScores)}
        <p class="radar-caption">Plotted as readiness (100 \u2212 risk score) at each checkpoint. Green = low risk, amber = moderate, red = high.</p>
      </div>

      <h2 class="section-title">Remediation plan</h2>
      <p class="section-sub">${needsWork.length ? `Every checkpoint scoring Moderate or High, ranked by risk, with concrete next steps. Check items off as you close them out.` : `Nothing scored Moderate or High risk — see the on-track summary below.`}</p>
      <div class="priority-list">
        ${needsWork.map((c,idx)=>{
          const t = tierOf(c.score);
          return `
          <div class="priority-card" style="border-left-color:${t.color}">
            <h3>${escapeHtml(c.name)} <span class="tier-tag" style="background:${t.bg};color:${t.color}">${c.score}/100 · ${t.label}</span><button type="button" class="info-btn" data-cat-id="${c.id}" aria-label="Learn more about ${escapeHtml(c.name)}">i</button></h3>
            <p>${escapeHtml(c.remediation.summary)}</p>
            <ul class="checklist">
              ${c.remediation.actions.map((a,ai)=>`
                <li class="check-item">
                  <input type="checkbox" id="chk_${idx}_${ai}">
                  <label for="chk_${idx}_${ai}">${escapeHtml(a.text)}</label>
                  ${a.url ? `<a class="item-link" href="${a.url}" target="_blank" rel="noopener" aria-label="Starting place for: ${escapeHtml(a.text)}" title="Starting place">\u2197</a>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>`;
        }).join('')}
      </div>

      ${onTrack.length ? `
      <div class="on-track-strip">
        <h3>On track</h3>
        <div class="on-track-items">
          ${onTrack.map(c=>`<span>${escapeHtml(c.name)} — ${c.score}/100</span>`).join('')}
        </div>
      </div>` : ''}

      <h2 class="section-title">Full breakdown</h2>
      <p class="section-sub">All ten checkpoints, ranked by risk.</p>
      <div class="breakdown-list">
        ${sorted.map(c=>{
          const t = tierOf(c.score);
          return `
          <div class="breakdown-row">
            <div class="breakdown-name">${escapeHtml(c.name)}</div>
            <div class="breakdown-bar-track"><div class="breakdown-bar-fill" style="width:${c.score}%;background:${t.color}"></div></div>
            <div class="breakdown-score mono" style="color:${t.color}">${c.score}</div>
          </div>`;
        }).join('')}
      </div>

      <div class="built-by-coach">
        <div class="copy">
          <h3>${featuredCoach.isCreator ? 'Built by a coach' : 'Your coach'}</h3>
          <p>${escapeHtml(featuredCoach.blurb)}</p>
        </div>
        <a class="btn" href="${featuredCoach.url}" target="_blank" rel="noopener">Visit ${escapeHtml(featuredCoach.url.replace(/^https?:\/\//,''))} &rarr;</a>
      </div>

      <h2 class="section-title">Find a coach</h2>
      <p class="section-sub">${coachIntro}</p>
      <div class="coach-grid">
        ${COACH_LINKS.map(link=>`
          <div class="coach-card">
            <h4>${escapeHtml(link.name)}</h4>
            <p>${escapeHtml(link.blurb)}</p>
            <a href="${link.url}" target="_blank" rel="noopener">Visit site →</a>
          </div>
        `).join('')}
      </div>

      <div class="btn-row no-print">
        <button class="btn" id="exportPdfBtn">Export PDF</button>
        <button class="btn ghost" id="printBtn">Print</button>
        <button class="btn ghost" id="retakeBtn">Retake Assessment</button>
      </div>

      <footer class="note no-print">
        This tool is a self-assessment aid for identifying where your final prep needs attention. It doesn't replace guidance from a coach, and isn't medical advice — talk to a doctor about any pre-existing condition or new symptom before you go.
      </footer>

      ${renderFooter()}
    </div>
  </section>
  ${renderLicenseModal()}
  ${renderResourcesModal()}`;
}

/* =========================================================
   RENDER: COMPARE PROGRESS
========================================================= */
function renderUploadSlot(key, label, data, error, loading, switchToLiveId){
  let body = '';
  if(loading){
    body = `<p class="upload-summary">Reading PDF\u2026</p>`;
  } else if(data){
    body = `<div class="upload-summary"><strong>${data.overall}/100</strong>${data.event ? escapeHtml(data.event) : 'Uploaded assessment'}${data.date ? ' \u00b7 '+escapeHtml(data.date) : ''}</div>`;
  } else if(error){
    body = `<p class="upload-error">${escapeHtml(error)}</p>`;
  }
  return `
  <div class="upload-slot ${data?'ready':''} ${error?'error':''}">
    <h3>${label}</h3>
    ${body}
    <label class="file-label">
      ${data||error ? 'Choose a different file' : 'Choose PDF'}
      <input type="file" accept="application/pdf" data-slot="${key}">
    </label>
    ${switchToLiveId ? `<button type="button" class="upload-switch" id="${switchToLiveId}">Use my just-completed results instead \u2192</button>` : ''}
  </div>`;
}

function renderAfterSlot(cmp, liveData){
  if(cmp.afterMode === 'live' && liveData){
    return `
    <div class="upload-slot ready">
      <h3>Latest Assessment</h3>
      <div class="upload-summary"><strong>${liveData.overall}/100</strong>${liveData.event ? escapeHtml(liveData.event) : 'Just-completed results'}</div>
      <button type="button" class="upload-switch" id="afterSwitchToUpload">Compare two saved PDFs instead \u2192</button>
    </div>`;
  }
  return renderUploadSlot('after', 'Latest Assessment', cmp.afterData, cmp.afterError, cmp.afterLoading, liveData ? 'afterSwitchToLive' : null);
}

function renderComparisonResults(before, after){
  const { insights, stillWeak } = generateInsights(before, after);
  return `
  <h2 class="section-title">What's changed</h2>
  <p class="compare-meta">${before.event ? escapeHtml(before.event) : 'Earlier'}${before.date ? ' ('+escapeHtml(before.date)+')' : ''} &rarr; ${after.event ? escapeHtml(after.event) : 'Latest'}${after.date ? ' ('+escapeHtml(after.date)+')' : ''}</p>

  <div class="radar-wrap">
    ${comparisonRadarSVG(before, after)}
    <p class="radar-caption"><span class="legend-dot before"></span>Earlier &nbsp;&nbsp; <span class="legend-dot after"></span>Latest &mdash; colored points are this checkpoint's current risk level</p>
  </div>

  <h2 class="section-title">Insights</h2>
  <ul class="insight-list">
    ${insights.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}
  </ul>

  <h2 class="section-title">Still needs focus</h2>
  ${stillWeak.length ? `
    <p class="section-sub">Scoring Moderate or High in your latest assessment, regardless of whether they've improved.</p>
    <div class="breakdown-list">
      ${stillWeak.map(d=>{
        const t = tierOf(d.after);
        return `
        <div class="breakdown-row">
          <div class="breakdown-name">${escapeHtml(d.name)}</div>
          <div class="breakdown-bar-track"><div class="breakdown-bar-fill" style="width:${d.after}%;background:${t.color}"></div></div>
          <div class="breakdown-score mono" style="color:${t.color}">${d.after}</div>
        </div>`;
      }).join('')}
    </div>
  ` : `<p class="section-sub">Nothing scored Moderate or High this time \u2014 solid work.</p>`}
  `;
}

function renderCompare(){
  const cmp = state.compare;
  const liveData = getLiveAssessmentData();
  const bothReady = !!(cmp.beforeData && cmp.afterData);

  return `
  <section class="hero" style="padding:56px 0 40px;">
    <div class="wrap">
      <div class="eyebrow">Compare Progress</div>
      <h1 style="font-size:clamp(32px,6vw,52px);line-height:0.95;">See What's<br><em>Changed</em></h1>
      <p class="lead" style="font-size:16px;margin-top:16px;">Upload an earlier assessment PDF (exported by this tool) to see how your risk profile has shifted.</p>
    </div>
  </section>
  <section class="compare-body">
    <div class="wrap">
      <div class="compare-uploads">
        ${renderUploadSlot('before', 'Earlier Assessment', cmp.beforeData, cmp.beforeError, cmp.beforeLoading)}
        ${renderAfterSlot(cmp, liveData)}
      </div>

      ${bothReady
        ? renderComparisonResults(cmp.beforeData, cmp.afterData)
        : `<p class="compare-hint">Once both assessments are in, you'll see an overlaid readiness radar, what's improved, what hasn't, and where to focus next.</p>`
      }

      <div class="btn-row no-print">
        ${bothReady ? `<button class="btn" id="exportCompareBtn">Export Comparison PDF</button>` : ''}
        <button class="btn ghost" id="compareBackBtn">&larr; Back to Assessment</button>
      </div>

      ${renderFooter()}
    </div>
  </section>
  ${renderLicenseModal()}`;
}

function renderFooter(){
  return `
  <div class="site-footer">
    <span class="copyright">${copyrightLine()}</span>
    <span class="footer-dot">\u00b7</span>
    <span>v${QUESTIONNAIRE_VERSION}</span>
    <span class="footer-dot">\u00b7</span>
    <button type="button" id="licenseBtn">License</button>
  </div>`;
}

function renderLicenseModal(){
  return `
  <div class="modal-overlay" id="licenseModal">
    <div class="modal-box">
      <button class="modal-close" id="licenseModalClose" aria-label="Close">&times;</button>
      <div class="modal-sub">License</div>
      <h2 style="font-size:24px;">Personal use is free.<br>Coaching &amp; commercial use isn't.</h2>
      <p style="font-size:14px;color:var(--ink-soft);margin:10px 0 22px;">Free for your own personal training and event prep. If you're a coach, gym, or business using this with clients or athletes you're paid to work with, a commercial license is required.</p>

      ${LICENSE_TIERS.map(t=>`
        <div class="license-tier">
          <h3>${t.name} <span class="price">${t.price}</span></h3>
          <p>${t.desc}</p>
          ${t.link ? `<a class="btn small" href="${t.link}" target="_blank" rel="noopener" style="text-decoration:none;margin-top:10px;">Get this license \u2192</a>` : ''}
        </div>
      `).join('')}

      <p class="fine-print">
        <strong>${copyrightLine()}</strong><br><br>
        <strong>Personal use</strong> means using this tool yourself, for your own training. <strong>Commercial/coaching use</strong> means using it with anyone you coach, train, or advise professionally or for payment, or distributing it as part of a paid product or service.<br><br>
        This tool is an independent project and isn't affiliated with, endorsed by, or sponsored by UESCA, Uphill Athlete, The Trek, or TrainingPeaks.<br><br>
        Provided "as is," without warranty. It's a self-assessment aid, not medical advice \u2014 see the disclaimer on the results page.
      </p>
    </div>
  </div>`;
}

function renderResourcesModal(){
  return `
  <div class="modal-overlay" id="resourcesModal">
    <div class="modal-box">
      <button class="modal-close" id="resourcesModalClose" aria-label="Close">&times;</button>
      <div class="modal-sub">Learn more</div>
      <div id="resourcesModalBody"></div>
    </div>
  </div>`;
}
function resourceLinkRow(kind, item){
  if(!item) return '';
  return `
  <div class="resource-link">
    <span class="kind">${kind}</span>
    <div class="body">
      <a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
      ${item.source ? `<span class="src">${escapeHtml(item.source)}</span>` : `<span class="src">YouTube</span>`}
    </div>
  </div>`;
}
function openResourcesModal(catId){
  const ci = CATEGORIES.findIndex(c=>c.id===catId);
  if(ci===-1) return;
  const cat = CATEGORIES[ci];
  const res = getResources(ci);
  const body = document.getElementById('resourcesModalBody');
  if(!body || !res) return;
  body.innerHTML = `
    <h2 style="font-size:22px;">${escapeHtml(cat.name)}</h2>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:6px 0 16px;">A couple of starting points if you want to dig into this checkpoint further.</p>
    ${resourceLinkRow('Article', res.article)}
    ${resourceLinkRow('Video', res.video)}
  `;
  document.getElementById('resourcesModal').classList.add('open');
}

/* =========================================================
   UTIL
========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================
   MAIN RENDER + EVENTS
========================================================= */
function render(scrollTop = true){
  const app = document.getElementById('app');
  if(state.screen==='hero') app.innerHTML = renderHero();
  else if(state.screen==='stepper') app.innerHTML = renderStepper();
  else if(state.screen==='compare') app.innerHTML = renderCompare();
  else app.innerHTML = renderResults();

  attachEvents();
  if(scrollTop){
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }
}

function attachEvents(){
  const licenseBtn = document.getElementById('licenseBtn');
  const licenseModal = document.getElementById('licenseModal');
  if(licenseBtn && licenseModal){
    licenseBtn.addEventListener('click', ()=> licenseModal.classList.add('open'));
    document.getElementById('licenseModalClose').addEventListener('click', ()=> licenseModal.classList.remove('open'));
    licenseModal.addEventListener('click', e=>{ if(e.target===licenseModal) licenseModal.classList.remove('open'); });
  }

  const resourcesModal = document.getElementById('resourcesModal');
  if(resourcesModal){
    document.getElementById('resourcesModalClose').addEventListener('click', ()=> resourcesModal.classList.remove('open'));
    resourcesModal.addEventListener('click', e=>{ if(e.target===resourcesModal) resourcesModal.classList.remove('open'); });
    document.querySelectorAll('.info-btn[data-cat-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> openResourcesModal(btn.dataset.catId));
    });
  }

  if(state.screen==='hero'){
    document.getElementById('eventName').addEventListener('input', e=> state.eventName = e.target.value);
    document.getElementById('eventDate').addEventListener('input', e=>{
      state.eventDate = e.target.value;
      state.phase = suggestPhase(state.eventDate) || 'taper';
      render(false);
    });
    document.getElementById('startBtn').addEventListener('click', ()=>{
      initAnswers();
      state.screen='stepper'; state.step=0; render();
    });
    const compareLink = document.getElementById('compareFromHeroBtn');
    if(compareLink) compareLink.addEventListener('click', ()=>{
      resetCompare();
      state.screen='compare'; render();
    });
  }
  else if(state.screen==='stepper'){
    document.querySelectorAll('.opt input[type=radio]').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const ci = +e.target.dataset.ci, qi = +e.target.dataset.qi;
        state.answers[ci][qi] = +e.target.value;
        render(false);
      });
    });
    document.getElementById('backBtn').addEventListener('click', ()=>{
      if(state.step>0){ state.step--; render(); }
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      if(!allAnswered(state.step)){
        document.getElementById('navHint').textContent = 'Answer every question to continue.';
        return;
      }
      if(state.step < CATEGORIES.length-1){ state.step++; render(); }
      else { state.screen='results'; render(); }
    });
  }
  else if(state.screen==='compare'){
    document.querySelectorAll('input[type=file][data-slot]').forEach(input=>{
      input.addEventListener('change', async (e)=>{
        const slot = e.target.dataset.slot;
        const file = e.target.files[0];
        if(!file) return;
        if(slot==='before'){ state.compare.beforeLoading=true; state.compare.beforeError=null; state.compare.beforeData=null; }
        else { state.compare.afterLoading=true; state.compare.afterError=null; state.compare.afterData=null; }
        render(false);
        const result = await parseUeraPdf(file);
        if(slot==='before'){
          state.compare.beforeLoading=false;
          if(result.ok){ state.compare.beforeData=result.data; } else { state.compare.beforeError=result.error; }
        } else {
          state.compare.afterLoading=false;
          if(result.ok){ state.compare.afterData=result.data; } else { state.compare.afterError=result.error; }
        }
        render(false);
      });
    });
    const switchToUpload = document.getElementById('afterSwitchToUpload');
    if(switchToUpload) switchToUpload.addEventListener('click', ()=>{
      state.compare.afterMode='upload'; state.compare.afterData=null; state.compare.afterError=null;
      render(false);
    });
    const switchToLive = document.getElementById('afterSwitchToLive');
    if(switchToLive) switchToLive.addEventListener('click', ()=>{
      state.compare.afterMode='live'; state.compare.afterData=getLiveAssessmentData(); state.compare.afterError=null;
      render(false);
    });
    const exportCompareBtn = document.getElementById('exportCompareBtn');
    if(exportCompareBtn) exportCompareBtn.addEventListener('click', ()=>{
      try{ generateComparePDF(state.compare.beforeData, state.compare.afterData); }
      catch(err){
        console.error(err);
        alert("Couldn't generate the comparison PDF. Try again in a moment.");
      }
    });
    document.getElementById('compareBackBtn').addEventListener('click', ()=>{
      const hasLiveResults = state.answers && !state.answers.some(a=>a.some(v=>v===null));
      state.screen = hasLiveResults ? 'results' : 'hero';
      render();
    });
  }
  else if(state.screen==='results'){
    document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
      try{ generatePDF(); }
      catch(err){
        console.error(err);
        alert("Couldn't generate the PDF. Try the Print button instead.");
      }
    });
    document.getElementById('printBtn').addEventListener('click', ()=> window.print());
    document.getElementById('retakeBtn').addEventListener('click', ()=>{
      initAnswers();
      state.screen='hero'; state.step=0; render();
    });
    document.querySelectorAll('.check-item input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', e=>{
        e.target.closest('.check-item').classList.toggle('done', e.target.checked);
      });
    });
    const compareLink = document.getElementById('compareFromResultsBtn');
    if(compareLink) compareLink.addEventListener('click', ()=>{
      resetCompare();
      state.compare.afterMode='live';
      state.compare.afterData=getLiveAssessmentData();
      state.screen='compare'; render();
    });
  }
}

render();
</script>
</body>
</html>
